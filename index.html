function fmtNum(n){
  if (!Number.isFinite(n)) return 'Error';
  const r = Math.round(n * 1e8) / 1e8;
  let out = String(r);
  if (out.includes('.')) out = out.replace(/0+$/, '').replace(/\.$/, '');
  return out;
}
/** Tiny shunting-yard evaluator — standard precedence, no eval(). */
function evalExpr(src){
  const t = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const tokens = t.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
  if (!tokens || !tokens.length) return null;
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const out = [], ops = [];
  let wantNum = true;
  for (const tk of tokens){
    if (/^[\d.]/.test(tk)) {
      if (!wantNum) return null;
      out.push(parseFloat(tk)); wantNum = false;
    } else {
      if (wantNum) return null;
      while (ops.length && prec[ops[ops.length-1]] >= prec[tk]) out.push(ops.pop());
      ops.push(tk); wantNum = true;
    }
  }
  if (wantNum) return null;
  while (ops.length) out.push(ops.pop());
  const st = [];
  for (const tk of out){
    if (typeof tk === 'number') st.push(tk);
    else {
      const b = st.pop(), a = st.pop();
      if (a === undefined || b === undefined) return null;
      if (tk === '/' && b === 0) return null;
      st.push(tk === '+' ? a + b : tk === '-' ? a - b : tk === '*' ? a * b : a / b);
    }
  }
  return st.length === 1 && Number.isFinite(st[0]) ? st[0] : null;
}
function renderCalc(){
  const c = state.calc || { expr: '', last: '', done: false };
  const keys = [
    ['C', 'fn'], ['⌫', 'fn'], ['%', 'fn'], ['÷', 'op'],
    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['0', 'zero'], ['.', ''], ['=', 'eq'],
  ];
  $('#sheetBody').innerHTML = `
    <div class="calc">
      <div class="calc-expr">${esc(c.last || '')}</div>
      <div class="calc-out" id="calcOut">${esc(c.expr || '0')}</div>
      <div class="calc-pad">
        ${keys.map(([k, cls]) => `<button class="${cls}" data-act="calcKey" data-k="${esc(k)}" aria-label="${esc(k)}">${esc(k)}</button>`).join('')}
      </div>
    </div>`;
  $('#sheetFoot').innerHTML = '';
}
function calcKey(k){
  const c = state.calc;
  if (!c) return;
  const isNum = /^[0-9.]$/.test(k);
  const isOp = '×÷−+'.includes(k);
  if (k === 'C') { c.expr = ''; c.last = ''; c.done = false; }
  else if (k === '⌫') {
    if (c.done) { c.expr = ''; c.last = ''; c.done = false; }
    else c.expr = c.expr.slice(0, -1);
  }
  else if (k === '%') { if (c.expr && !/[×÷−+]$/.test(c.expr)) c.expr += '÷100'; }
  else if (k === '=') {
    const v = evalExpr(c.expr);
    if (v !== null) { c.last = c.expr + ' ='; c.expr = fmtNum(v); c.done = true; }
  }
  else if (isNum) {
    if (c.done) { c.expr = ''; c.last = ''; c.done = false; }
    const seg = c.expr.split(/[×÷−+]/).pop();
    if (k === '.' && seg.includes('.')) { /* one dot per number */ }
    else if (k === '.' && seg === '') c.expr += '0.';
    else c.expr += k;
  }
  else if (isOp) {
    if (c.done) c.done = false;
    if (!c.expr) { if (k === '−') c.expr = '−'; }
    else if (/[×÷−+]$/.test(c.expr)) c.expr = c.expr.slice(0, -1) + k;
    else c.expr += k;
  }
  renderCalc();
  const out = $('#calcOut');
  if (out) out.scrollLeft = out.scrollWidth;
}

function blockedNotes(){
  try { return JSON.parse(localStorage.getItem(NOTE_BLOCK_KEY) || '[]'); } catch (e) { return []; }
}
function blockNote(key){
  try {
    const list = blockedNotes();
    if (!list.includes(key)) {
      list.push(key);
      localStorage.setItem(NOTE_BLOCK_KEY, JSON.stringify(list.slice(-100)));
    }
  } catch (e) { /* storage blocked */ }
}
function autoIconFor(k){
  if (/\b(bank|card|fee|charge|loan|credit)\b/.test(k)) return '💳';
  if (/\b(data|phone|wifi|internet|digi|maxis|celcom|unifi|umobile)\b/.test(k)) return '📱';
  if (/\b(ai|gpt|deepseek|chatgpt|claude|sub|subscription|software)\b/.test(k)) return '🤖';
  if (/\b(wash|vacuum)\b/.test(k)) return '🧼';
  if (/\b(service|tyre|tire|oil|brake|repair)\b/.test(k)) return '🔧';
  if (/\b(food|makan|kopi|lunch|dinner|breakfast|roti|nasi)\b/.test(k)) return '🍚';
  return '🏷️';
}
/** Notes that keep landing under "Other" and are worth offering as a category. */
function noteSuggestions(){
  if (!state.data) return [];
  const cats = state.data.settings.cats.out;
  const blocked = blockedNotes();
  const groups = new Map();
  state.data.entries.forEach(e => {
    if (e.type !== 'expense' || e.cat !== 'other') return;
    const k = noteKey(e.note);
    if (k.length < 3 || blocked.includes(k)) return;
    if (!groups.has(k)) groups.set(k, { ids: [], total: 0, last: e.date });
    const g = groups.get(k);
    g.ids.push(e.id);
    g.total += e.amount;
    if (e.date > g.last) g.last = e.date;
  });
  const out = [];
  for (const [key, g] of groups) {
    if (g.ids.length < NOTE_SUGGEST_MIN) continue;
    if (cats.some(c => noteKey(c.name) === key)) continue;
    out.push({
      key,
      name: key.replace(/\b\p{L}/gu, m => m.toUpperCase()).slice(0, 28),
      icon: autoIconFor(key),
      count: g.ids.length,
      total: g.total,
      last: g.last,
    });
  }
  return out.sort((a, b) => b.count - a.count || b.total - a.total).slice(0, 3);
}
function suggestionCards(){
  const list = noteSuggestions();
  if (!list.length) return '';
  return `<div class="suggest" aria-label="Category suggestions">
    ${list.map(x => `<div class="sug">
      <div class="sug-ic">${x.icon}</div>
      <div class="sug-main">
        <div class="sug-t">“${esc(x.name)}” could be its own category</div>
        <div class="sug-s">${x.count} entries under Other · ${rmR(x.total / 100)}</div>
      </div>
      <button class="sug-go" data-act="promoteNote" data-key="${esc(x.key)}">Make it</button>
      <button class="sug-x" data-act="dismissNote" data-key="${esc(x.key)}" aria-label="Not now">×</button>
    </div>`).join('')}
  </div>`;
}
/** Turn a suggested note into a real category, moving its past entries with it. */
function promoteNote(key){
  const k = noteKey(key);
  const ids = state.data.entries
    .filter(e => e.type === 'expense' && e.cat === 'other' && noteKey(e.note) === k)
    .map(e => e.id);
  if (!ids.length) { render(); return; }
  const cats = state.data.settings.cats.out;
  const id = ('auto-' + k.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')).slice(0, 26);
  if (id === 'auto-' || cats.some(c => c.id === id)) { render(); return; }
  const name = k.replace(/\b\p{L}/gu, m => m.toUpperCase()).slice(0, 28);
  cats.push({ id, name, icon: autoIconFor(k), auto: true });
  ids.forEach(eid => {
    const e = state.data.entries.find(x => x.id === eid);
    if (e) { e.cat = id; e.updated = new Date().toISOString(); }
  });
  state.data.updatedAt = new Date().toISOString();
  saveNow();
  render();
  toast(`“${name}” is now a category · ${ids.length} moved`, 5200, () => {
    state.data.settings.cats.out = state.data.settings.cats.out.filter(c => c.id !== id);
    ids.forEach(eid => {
      const e = state.data.entries.find(x => x.id === eid);
      if (e) { e.cat = 'other'; e.updated = new Date().toISOString(); }
    });
    blockNote(k);
    state.data.updatedAt = new Date().toISOString();
    saveNow({ deletedCats: [id] });
    render();
    toast('Put back under Other', 2600);
  });
}
function dismissNote(key){
  blockNote(noteKey(key));
  render();
  toast('Not now — it stays under Other', 2400);
}

function importFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let incoming = null;
    try {
      const raw = JSON.parse(String(reader.result));
      const tag = raw && raw.app;
      const body = (tag === 'baki' || tag === 'netshift' || tag === 'grab-money') ? raw : (raw && raw.data) || raw;
      incoming = normalizeStore(body);
    } catch (e) {
      toast('That file is not a valid backup', 3500);
      return;
    }
    if (!incoming) { toast('That file is not a valid backup', 3500); return; }
    const nEntries = incoming.entries.length;
    const nShifts = (incoming.shifts || []).length;
    if (!nEntries && !nShifts) { toast('That backup has no entries in it', 3500); return; }

    const before = state.data.entries.length + (state.data.shifts || []).length;
    const merged = mergeStores(state.data, incoming);
    const after = merged.entries.length + (merged.shifts || []).length;
    const added = Math.max(0, after - before);

    // Merge only. Restoring never deletes anything — that mistake cost real data once.
    if (!confirm(`Backup: ${nEntries} entries, ${nShifts} shifts.\n\n` +
                 `OK = add them to this tracker (${added} new, nothing deleted)\n` +
                 `Cancel = do nothing`)) {
      toast('Import cancelled — nothing changed', 2600);
      return;
    }

    state.data = merged;
    state.data.updatedAt = new Date().toISOString();
    // these ids may have been tombstoned by an earlier "delete all" — revive them,
    // otherwise the server silently drops the restore
    const revived = [
      ...incoming.entries.map(e => e.id),
      ...(incoming.shifts || []).map(x => x.id),
    ];
    saveNow({ undeleteIds: revived });
    render();
    toast(`Restored · ${added} new, ${after} total`, 3200);
  };
  reader.readAsText(file);
}

/* ---------- sample data ---------- */
function sampleData(){
  let seed = 20261027;
  const mark = { sample: true };
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const entries = [], shifts = [];
  const now = new Date().toISOString();
  for (let back = 9; back >= 0; back--) {
    const date = addDays(todayISO(), -back);
    const wd = fromISO(date).getDay();
    const weak = wd === 1;                       // Mondays are slower
    const hours = Math.round((weak ? 4.5 + rnd() * 2 : 6 + rnd() * 3) * 10) / 10;
    const km = Math.round((weak ? 95 : 135) + rnd() * 75);
    const gross = Math.round((weak ? 150 : 205) + rnd() * 115);   // ringgit
    const tolls = rnd() > 0.55 ? Math.round((2.5 + rnd() * 6) * 100) : 0;
    shifts.push({
      id: uid(), date,
      start: pick(['07:00', '07:30', '08:00', '17:00', '18:00', '18:30']),
      hours, odoStart: null, odoEnd: null, km,
      gross: gross * 100,
      incentive: rnd() > 0.7 ? Math.round((2 + rnd() * 8) * 100) : 0,
      extra: tolls,
      kmPerLitre: pick([14, 14, 12, 11]),
      note: weak ? 'slow Monday' : pick(['PJ ↔ KL', 'morning run', 'evening peak', 'rain shift']),
      updated: now, ...mark,
    });
    const petrol = Math.round((weak ? 28 : 35 + rnd() * 14) * 100);
    entries.push({ id: uid(), date, type: 'expense', cat: 'fuel', amount: petrol, note: pick(['Shell · Jalan Klang Lama', 'Petronas · Sunway', 'BHP · Bangsar']), updated: now, ...mark });
    if (rnd() > 0.82) entries.push({ id: uid(), date, type: 'expense', cat: 'parking', amount: Math.round((1 + rnd() * 4) * 100), note: pick(['Mall parking', 'Roadside coupon']), updated: now, ...mark });
    if (rnd() > 0.72) entries.push({ id: uid(), date, type: 'expense', cat: 'food', amount: Math.round((7 + rnd() * 9) * 100), note: pick(['Mamak', 'Kopitiam lunch', 'Roti canai + teh']), updated: now, ...mark });
  }
  entries.push({ id: uid(), date: addDays(todayISO(), -6), type: 'expense', cat: 'maintenance', amount: 18500, note: 'Engine oil + filter, service', updated: now, ...mark });
  entries.push({ id: uid(), date: addDays(todayISO(), -4), type: 'expense', cat: 'carwash', amount: 1200, note: 'Wash + vacuum', updated: now, ...mark });
  entries.push({ id: uid(), date: addDays(todayISO(), -1), type: 'expense', cat: 'phone', amount: 3500, note: 'Monthly data topup', updated: now, ...mark });
  return { entries, shifts };
}

/* ---------- reconnect ---------- */
async function tryReconnect(){
  if (pendingWrite) return;
  const base = state.sync.server || serverUrl();
  if (!base) return;
  const wasQueued = offlineQueue;
  if (!state.sync.server) {
    const ok = await pingServer();
    if (!ok) return;
    state.sync.server = base;
  }
  try {
    const remote = await pullServer();
    if (remote) state.data = mergeStores(state.data, remote, state.sync.dead || {});
    await pushServer();
    offlineQueue = false;
    setSync('synced', 'synced');
    render();
    if (wasQueued) toast('Back online · everything synced', 2800);
  } catch (e) {
    setSync('local', 'offline · saved');
  }
}
function watchChromeScroll(){
  const bar = document.querySelector('.topbar');
  const nav = document.querySelector('.nav');
  if (!bar || !nav) return;
  let lastY = window.scrollY || 0;
  let ticking = false;
  const update = () => {
    const doc = document.documentElement;
    const y = window.scrollY || doc.scrollTop;
    const atTop = y <= 4;
    // hide the header while scrolling down, bring it back on the way up
    const dy = y - lastY;
    if (y < 80) bar.classList.remove('hidden');
    else if (dy > 8) bar.classList.add('hidden');
    else if (dy < -8) bar.classList.remove('hidden');
    lastY = y;
    const hidden = bar.classList.contains('hidden');
    doc.style.setProperty('--topbar-offset', hidden ? '0px' : ((bar.offsetHeight || 68) + 'px'));
    const scrollable = doc.scrollHeight > window.innerHeight + 8;
    // header rests when nothing has slid under it yet
    bar.classList.toggle('scrolled', !atTop);
    if (window.innerWidth >= 760) {
      // desktop: the tab bar sits under the header, so it follows the header
      nav.classList.toggle('scrolled', !atTop);
    } else {
      // phone: the tab bar is at the bottom — it has content under it until the very end
      const atBottom = y + window.innerHeight >= doc.scrollHeight - 8;
      nav.classList.toggle('scrolled', scrollable && !atBottom);
    }
  };
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
}

function watchConnection(){
  window.addEventListener('online', tryReconnect);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && offlineQueue) tryReconnect();
  });
  // keep the chip honest: no signal vs. no laptop
  window.addEventListener('offline', () => setSync('local', 'no signal · saved here'));
  window.addEventListener('online', () => { if (!state.sync.server) setSync('local', 'on this device'); });
  setTimeout(updateSyncChip, 300);
  setInterval(updateSyncChip, 4000);
}
function registerServiceWorker(){
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('offline cache unavailable', err));
}

/* ---------- boot ---------- */
async function boot(){
  const local = loadLocal();
  const noSeed = /[?&]noseed=1/.test(location.search);
  if (local) {
    state.data = local;
  } else {
    state.data = emptyData();
    saveLocal();
  }
  const hash = location.hash.replace('#', '');
  if (['today', 'history', 'shifts', 'summary', 'settings'].includes(hash)) state.view = hash;

  // nav
  $$('.nav button').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.tab;
    if (state.view === 'history') {
      state.filters.month = state.month;
      state.filters.type = 'all'; state.filters.cat = 'all'; state.filters.q = ''; state.filters.catsOpen = false;
    }
    history.replaceState(null, '', '#' + state.view);
    render();
    window.scrollTo({ top: 0 });
  }));

  // delegated actions
  document.addEventListener('click', onAction);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', e => {
    const sheetOpen = $('#sheetWrap').classList.contains('open');
    if (e.key === 'Escape' && sheetOpen) { closeSheet(); return; }
    if (state.calc && sheetOpen && $('#calcOut')) {
      const k = e.key;
      const map = { '+': '+', '-': '−', '*': '×', '/': '÷', '%': '%', 'Enter': '=', '=': '=', 'Backspace': '⌫' };
      if (/^[0-9.]$/.test(k)) { calcKey(k); e.preventDefault(); return; }
      if (map[k]) { calcKey(map[k]); e.preventDefault(); return; }
      if (k.toLowerCase() === 'c') { calcKey('C'); e.preventDefault(); return; }
    }
    if (sheetOpen && state.sheet && e.key === 'Enter' && e.target && (e.target.id === 'amtInput' || e.target.id === 'noteInput')) {
      e.preventDefault();
      if (!$('#saveBtn').disabled) saveSheet();
    }
  });

  render();
  registerServiceWorker();
  watchConnection();
  watchChromeScroll();
  applyTheme();
  try {
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    if (mq) (mq.addEventListener ? mq.addEventListener.bind(mq) : mq.addListener.bind(mq))('change', applyTheme);
  } catch (e) {}
  // ask the browser to keep this origin's data, then show what it decided
  ensurePersistence().then(refreshStorageInfo).then(() => { if (state.view === 'settings') render(); });
  window.addEventListener('resize', syncTopbarHeight);
  const action = new URLSearchParams(location.search).get('a');
  if (action === 'income' || action === 'expense') {
    setTimeout(() => openSheet({ type: action }), 350);
  }
  if (noSeed) { localStorage.removeItem(SERVER_URL_KEY); state.sync.server = ''; setSync('local', 'on this device'); }
  else await initSync();
  if (backfillShiftFees()) { state.data.updatedAt = new Date().toISOString(); queueSave(); }
  // one-off: retire the old annual "Car insurance" category on the server too
  try {
    if (!localStorage.getItem('baki.mergedInsurance')) {
      localStorage.setItem('baki.mergedInsurance', '1');
      saveNow({ deletedCats: ['insurance'] });
    }
  } catch (e) {}
  purgeDemoOnce();
  // Demo data is opt-in (More → Load sample week). A fresh tracker stays empty.
}
function onInput(e){

    const key = t.dataset.profit;
    const n = Number(String(t.value).replace(/[^0-9.]/g, ''));
    if (Number.isFinite(n) && n >= 0) {
      if (!state.data.settings.profit) state.data.settings.profit = clone(DEFAULT_PROFIT);
      state.data.settings.profit[key] = n;
      state.data.updatedAt = new Date().toISOString();
      queueSave();

  else if (t.id === 'amtInput') {

    if (state.sheet.amount !== t.value) t.value = state.sheet.amount;
    state.sheet.err = '';

    if (box) box.innerHTML = historyResults();

function onAction(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'closeSheet': closeSheet(); break;
    case 'openSheet': openSheet({ type: el.dataset.type }); break;
    case 'quickExp': openSheet({ type: 'expense', cat: el.dataset.cat }); break;
    case 'preset': {
      const add = Number(el.dataset.n) * 100;
      const cur = parseCents(state.sheet.amount) || 0;
      state.sheet.amount = String(((cur + add) / 100).toFixed(2)).replace(/\.?0+$/, '') || '0';
      const input = $('#amtInput');
      if (input) { input.value = state.sheet.amount; }
      updateSaveBtn();
      break;
    }
    case 'pickCat':
      state.sheet.cat = el.dataset.id;
      $$('.cat-pick button').forEach(b => b.classList.toggle('on', b.dataset.id === el.dataset.id));
      break;
    case 'saveEntry': saveSheet(); break;
    case 'deleteEntry': {
      const id = el.dataset.id;
      const removed = deleteEntry(id);
      closeSheet();
      render();
      if (removed) toast('Entry deleted', 5000, () => { restoreEntry(removed); render(); });
      break;
    }
    case 'editEntry': openSheet({ id: el.dataset.id }); break;
    case 'pickDay':
      state.dayDate = el.dataset.date;
      state.view = 'today';
      history.replaceState(null, '', '#today');
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'dayPrev': shiftDay(-1); break;
    case 'dayNext': shiftDay(1); break;
    case 'goHistory':
      state.view = 'history';
      state.filters = { month: state.dayDate.slice(0, 7), type: 'all', cat: 'all', q: '', catsOpen: false };
      history.replaceState(null, '', '#history');
      render();
      break;
    case 'monthPrev': {
      let [y, m] = state.filters.month.split('-').map(Number);
      const d = new Date(y, m - 2, 1);
      state.filters.month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
      state.month = state.filters.month;
      render(); break;
    }
    case 'monthNext': {
      let [y, m] = state.filters.month.split('-').map(Number);
      const d = new Date(y, m, 1);
      const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1);
      if (iso > todayISO().slice(0, 7)) break;
      state.filters.month = iso; state.month = iso; render(); break;
    }
    case 'filterCat': state.filters.cat = el.dataset.v; render(); break;
    case 'toggleCats': state.filters.catsOpen = !state.filters.catsOpen; render(); break;
    case 'sumPrev': shiftMonth(-1); break;
    case 'sumNext': shiftMonth(1); break;
    case 'sumPick': {
      const v = prompt('Jump to month (YYYY-MM):', state.month);
      if (v && /^\d{4}-\d{2}$/.test(v) && v <= todayISO().slice(0, 7)) { state.month = v; render(); }
      break;
    }
    case 'exportJson': exportJson(); break;
    case 'exportCsv': exportCsv(); break;
    case 'exportShiftsCsv': exportShiftsCsv(); break;
    case 'importJson': {
      // keep a real, attached input: detached inputs don't reliably open a picker,
      // and the value must be cleared or picking the same file again does nothing
      let inp = document.getElementById('importInput');
      if (!inp) {
        inp = document.createElement('input');
        inp.id = 'importInput';
        inp.type = 'file';
        inp.accept = '.json,application/json';
        inp.style.position = 'fixed';
        inp.style.left = '-9999px';
        inp.style.opacity = '0';
        inp.addEventListener('change', () => {
          const f = inp.files && inp.files[0];
          inp.value = '';
          importFile(f);
        });
        document.body.appendChild(inp);
      }
      inp.click();
      break;
    }
    case 'setTheme': setTheme(el.dataset.mode); break;
    case 'snapshotNow': snapshotTick(true); render(); toast('Snapshot saved on this device', 2600); break;
    case 'protectStorage':
      ensurePersistence().then(async () => {
        await refreshStorageInfo();
        render();
        toast(storageInfo.persisted ? 'Storage protected' : 'The browser declined — keep weekly backups', 3600);
      });
      break;
    case 'restoreSnap': restoreSnapshot(el.dataset.at); break;
    case 'promoteNote': promoteNote(el.dataset.key); break;
    case 'dismissNote': dismissNote(el.dataset.key); break;
    case 'addCat': addCategory(el.dataset.type); break;
    case 'delCat': deleteCategory(el.dataset.type, el.dataset.id); break;
    case 'loadSample': loadSample(); break;
    case 'clearSample': {
      const gone = [
        ...state.data.entries.filter(e => e.sample).map(e => e.id),
        ...(state.data.shifts || []).filter(x => x.sample).map(x => x.id),
      ];
      state.data.entries = state.data.entries.filter(e => !e.sample);
      state.data.shifts = (state.data.shifts || []).filter(x => !x.sample);
      state.data.updatedAt = new Date().toISOString();
      saveNow({ deletedIds: gone });
      state.dayDate = todayISO();
      render();
      toast(gone.length ? 'Sample entries cleared — you\'re tracking for real now' : 'Nothing to clear');
      break;
    }
    case 'reset': resetAll(); break;
    case 'openSync': state.view = 'settings'; history.replaceState(null, '', '#settings'); render(); break;
    case 'openAction': openActionSheet(); break;
    case 'openCalc': openCalc(); break;
    case 'calcKey': calcKey(el.dataset.k); break;
    case 'openShift': openShiftSheet({}); break;
    case 'gotoShifts':
      state.shiftMonth = state.view === 'summary' ? state.month : state.dayDate.slice(0, 7);
      state.view = 'shifts';
      history.replaceState(null, '', '#shifts');
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'editShift': openShiftSheet({ id: el.dataset.id }); break;
    case 'saveShift': saveShiftSheet(); break;
    case 'shiftHours': {
      if (!state.shiftSheet) break;
      const v = Number(el.dataset.v);
      state.shiftSheet.hours = String(v);
      const inp = $('#sHours'); if (inp) inp.value = String(v);
      updateShiftPreview();
      break;
    }
    case 'toggleShiftMore':
      if (state.shiftSheet) { state.shiftSheet.showMore = !state.shiftSheet.showMore; renderShiftSheet(); }
      break;
    case 'shiftEff': {
      if (!state.shiftSheet) break;
      const km = Number(el.dataset.km) || 0;
      state.shiftSheet.kmPerLitre = km > 0 ? km : null;
      $$('#effChips .chip-f').forEach(b => b.classList.toggle('on', Number(b.dataset.km) === km));
      updateShiftPreview();
      break;
    }
    case 'deleteShift': {
      const id = el.dataset.id;
      if (!confirm('Delete this shift? The odometer and payout for it will be removed.')) break;
      const removed = deleteShift(id);
      closeShiftSheet();
      render();
      if (removed) toast('Shift deleted', 5000, () => { state.data.shifts.push(removed); queueSave(); render(); });
      break;
    }
    case 'shiftPrev': case 'shiftNext': {
      let [y, m] = (state.shiftMonth || todayISO().slice(0, 7)).split('-').map(Number);
      const d = new Date(y, m - 1 + (act === 'shiftNext' ? 1 : -1), 1);
      const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1);
      if (iso > todayISO().slice(0, 7)) break;
      state.shiftMonth = iso;
      render();
      break;
    }
    case 'shiftPick': {
      const v = prompt('Jump to month (YYYY-MM):', state.shiftMonth || todayISO().slice(0, 7));
      if (v && /^\d{4}-\d{2}$/.test(v) && v <= todayISO().slice(0, 7)) { state.shiftMonth = v; render(); }
      break;
    }
    case 'goProfit': state.view = 'settings'; history.replaceState(null, '', '#settings'); render(); setTimeout(()=>{ const el=$('#profitSection'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 80); break;
    case 'syncTest': testSync(); break;
    case 'syncSave': saveServer(); break;
    case 'toastUndo': {
      const fn = $('#toast')._undo;
      if (fn) fn();
      $('#toast').classList.remove('show');
      break;
    }
  }
}
async function testSync(){
  const v = ($('#serverInput') && $('#serverInput').value || '').trim();
  const base = v ? v.replace(/\/+$/, '') : serverUrl();
  if (!base) { toast('Enter a server address first'); return; }
  try {
    const r = await fetch(base + '/api/ping', { cache: 'no-store', signal: AbortSignal.timeout(3000) });
    if (!r.ok) throw new Error('bad status');
    const j = await r.json();
    toast('Connected · server has ' + (j.entries || 0) + ' entries', 3600);
  } catch (e) {
    toast('Cannot reach that address. Is ./sync.sh running?', 4200);
  }
}
async function saveServer(){
  const v = (($('#serverInput') && $('#serverInput').value) || '').trim().replace(/\/+$/, '');
  if (!v) { localStorage.removeItem(SERVER_URL_KEY); state.sync.server = ''; setSync('local', 'on this device'); toast('Server cleared · this device only'); render(); return; }
  if (!/^https?:\/\//.test(v)) { toast('Start with http:// — e.g. http://192.168.1.8:8787', 4200); return; }
  localStorage.setItem(SERVER_URL_KEY, v);
  const ok = await pingServer();
  if (!ok) { toast('Saved, but server not reachable right now', 3800); setSync('local', 'offline · saved'); return; }
  try {
    const remote = await pullServer();
    if (remote) {
      state.data = mergeStores(state.data, remote, state.sync.dead || {});
      saveLocal();
      await pushServer();
    } else {
      await pushServer();
    }
    setSync('synced', 'synced');
    render();
    poll();
    toast('Connected · entries now sync between devices', 3600);
  } catch (e) {
    toast('Saved, but sync failed. Check the address.', 3800);
    setSync('local', 'offline · saved');
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
