<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* resolve the theme before first paint so there is no flash */
(function(){
  try {
    var t = 'auto';
    try { t = localStorage.getItem('baki.theme') || 'auto'; } catch (e) {}
    var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    var light = t === 'light' || (t === 'auto' && !!(mql && mql.matches));
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', light ? '#eef1e6' : '#0b0f0d');
  } catch (e) {
    try { document.documentElement.setAttribute('data-theme', 'dark'); } catch (e2) {}
  }
})();
</script>
<meta name="apple-mobile-web-app-title" content="Baki">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.v2.png">
<link rel="icon" type="image/png" sizes="48x48" href="icon-48.v2.png">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.v2.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.v2.png">
<meta name="description" content="Shift earnings and spending tracker for GrabCar drivers.">
<title>Baki · what your shift really pays</title>
<style>
/* ---------- type ---------- */
/* Inter (variable, latin subset) — self-hosted so the app stays fully offline.
   Interference-free: no CDN request, no flash of a different face once cached. */
@font-face{
  font-family:'Inter';
  src:url('fonts/inter-latin.woff2') format('woff2-variations'),
      url('fonts/inter-latin.woff2') format('woff2');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

@font-face{
  font-family:'Space Grotesk';
  src:url('fonts/space-grotesk-latin.woff2') format('woff2-variations'),
      url('fonts/space-grotesk-latin.woff2') format('woff2');
  font-weight:300 700;
  font-style:normal;
  font-display:swap;
}

/* ---------- tokens ---------- */
:root{
  /* semantic palette — dark is the default */
  --bg:#0b0f0d; --bg2:#0f1411;
  --surface:#151b18; --surface-2:#1b231f; --line:#28312c;
  --text:#f2f6ee; --muted:#93a09a; --dim:#828f88;
  --accent:#c4f042; --accent-ink:#10150a;
  --pos:#5ee0c0; --neg:#ff8b74;
  --pos-lo:rgba(94,224,192,.13); --neg-lo:rgba(255,139,116,.12);
  --warn:#f5c451;
  --shadow:none;
  --lift-up:inset 0 1px 0 rgba(255,255,255,.08), 0 -12px 28px rgba(0,0,0,.34);
  --lift-down:inset 0 -1px 0 rgba(255,255,255,.07), 0 12px 28px rgba(0,0,0,.34);
  /* legacy aliases kept so every rule below still resolves */
  --card:var(--surface); --card2:var(--surface-2);
  --lime:var(--accent); --lime-ink:var(--accent-ink);
  --in:var(--pos); --out:var(--neg); --in-lo:var(--pos-lo); --out-lo:var(--neg-lo);
  --dur:180ms;
  --ease:cubic-bezier(.32,.72,0,1);
  --radius:12px;      /* cards */
  --radius-md:10px;   /* buttons, inputs, stats */
  --radius-sm:8px;    /* chips, day cells */
  --s2:8px; --s4:16px; --s5:24px;

  --safe-b:env(safe-area-inset-bottom,0px);
  /* shared glass treatment for sticky/fixed chrome (header + tab bar) */
  --chrome-bg:#151b17;
  --chrome-line:rgba(255,255,255,.07);
  --blur:blur(22px) saturate(160%);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-head:'Space Grotesk','Inter',-apple-system,sans-serif;
  --num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
/* ---------- light: soft pastel, frosted surfaces ---------- */
html[data-theme="light"]{
  --bg:#eef1e6; --bg2:#f7f6ee;
  --surface:rgba(255,255,255,.66); --surface-2:rgba(255,255,255,.86); --line:rgba(24,36,26,.10);
  --text:#141a15; --muted:#4f5a53; --dim:#656f68;
  --accent:#3f7a37; --accent-ink:#ffffff;
  --pos:#1c7a58; --neg:#b0452f;
  --pos-lo:rgba(28,122,88,.12); --neg-lo:rgba(185,74,53,.12);
  --warn:#8f6210;
  --page-image:
    radial-gradient(1100px 620px at 8% -8%, #d9efd0 0%, rgba(217,239,208,0) 62%),
    radial-gradient(820px 520px at 98% 4%, #e4dcf6 0%, rgba(228,220,246,0) 58%),
    radial-gradient(760px 560px at 62% 104%, #fbe4cf 0%, rgba(251,228,207,0) 62%);
  --lift-up:inset 0 1px 0 rgba(255,255,255,.9), 0 -8px 24px rgba(38,58,40,.10);
  --lift-down:inset 0 -1px 0 rgba(255,255,255,.9), 0 8px 24px rgba(38,58,40,.10);
  --shadow:0 8px 24px rgba(38,58,40,.10), 0 1px 0 rgba(255,255,255,.7) inset;
  --chrome-bg:#f8f7f0;
  --chrome-line:rgba(24,36,26,.10);
}
html[data-theme="light"] body{
  background-color:var(--bg);
  background-image:var(--page-image);
  background-attachment:fixed;
  color-scheme:light;
}
html[data-theme="light"] .card,
html[data-theme="light"] .stat,
html[data-theme="light"] .sheet,
html[data-theme="light"] .set-body,
html[data-theme="light"] .strip-day{ backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
html[data-theme="light"] .card,
html[data-theme="light"] .stat{ box-shadow:var(--shadow); }
html[data-theme="light"] .chip,
html[data-theme="light"] .pill-stat,
html[data-theme="light"] .hero-date{ box-shadow:0 1px 2px rgba(38,58,40,.06); }
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{color-scheme:light}
html[data-theme="light"] input[type=date]::-webkit-calendar-picker-indicator,
html[data-theme="light"] input[type=month]::-webkit-calendar-picker-indicator{filter:none}
html[data-theme="light"] ::selection{background:var(--accent);color:#fff}

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:clip}
body{overflow-x:clip}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  min-height:100dvh; color-scheme:dark;
}
input,select,textarea{color-scheme:dark;background-color:var(--card);color:var(--text)}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{filter:invert(.75)}
::selection{background:var(--lime);color:var(--lime-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
h1,h2,h3,h4,p{margin:0}
a{color:var(--lime);text-decoration:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h2,.set-title,.brand-name,.hero-net,.stat .v,.metric .v,.big,.seg button{font-family:var(--font-head);letter-spacing:-.01em}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{max-width:560px;margin:0 auto;padding:14px 14px calc(150px + var(--safe-b))}
.topbar{display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:0 -14px 14px;padding:10px 14px;
  position:sticky;top:0;z-index:46;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  will-change:transform}
.topbar.hidden{transform:translateY(-102%)}
.topbar.scrolled{border-bottom-color:var(--chrome-line);background:var(--chrome-bg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--lift-down)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:34px;height:34px;flex:none;display:block;line-height:0}
.logo svg{display:block;border-radius:8px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--dim);margin-top:-2px;white-space:nowrap}
.sync-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:999px;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.sync-dot.synced{background:var(--in);box-shadow:0 0 0 3px var(--in-lo)}
.sync-dot.local{background:var(--warn)}
.sync-dot.err{background:var(--out)}

/* ---------- hero ---------- */
.hero{padding:8px 8px 4px;text-align:center;margin-bottom:var(--s4)}
.hero-date{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:2px;background:var(--card);border:1px solid var(--line)}
.hero-date button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.hero-date button:active{background:var(--card2)}
.hero-date button:disabled{opacity:.25}
.hero-day{font-size:13px;font-weight:650;padding:0 6px;min-width:118px}
.hero-day small{display:block;font-size:10.5px;font-weight:500;color:var(--dim);letter-spacing:.02em}
.hero-net{font-family:var(--font-head);font-size:clamp(36px,11vw,46px);font-weight:700;letter-spacing:-1.6px;
  line-height:1.15;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-net.pos{color:var(--text)}
.hero-net.neg{color:var(--out)}
.hero-net .cur{font-size:.5em;color:var(--muted);font-weight:600;letter-spacing:0;margin-right:2px}
.hero-label{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hero-split{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill-stat{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted)}
.pill-stat b{font-family:var(--num);font-weight:650;font-size:13px;color:var(--text)}
.pill-stat .d{width:6px;height:6px;border-radius:50%;flex:none}

/* ---------- day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 4px;margin:0 -2px var(--s4);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip-day{flex:1 1 0;min-width:0;background:var(--card);border:1px solid transparent;border-radius:var(--radius-sm);
  padding:7px 1px 6px;text-align:center;color:var(--muted);overflow:hidden}
.strip-day .wd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.strip-day .dd{font-size:15px;font-weight:700;margin-top:1px;color:var(--text)}
.strip-day .v{font-size:9.5px;font-family:var(--num);margin-top:2px;color:var(--muted);white-space:nowrap;letter-spacing:-.2px}
.strip-day .dot{width:4px;height:4px;border-radius:50%;background:var(--lime);margin:3px auto 0;visibility:hidden}
.strip-day.has .dot{visibility:visible}
.strip-day.sel{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.strip-day.sel .wd,.strip-day.sel .dd,.strip-day.sel .v{color:var(--lime-ink)}
.strip-day.sel .dot{background:var(--lime-ink)}
.strip-day.today:not(.sel){border-color:var(--line)}

/* ---------- quick add ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:var(--s5) 4px var(--s2)}
.section-head h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.section-head .hint{font-size:11.5px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  color:var(--text);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;font-weight:550;line-height:1.2;
  min-height:42px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chip:active{background:var(--card2)}
.chip .ci{font-size:14px;line-height:1}
.chip.in .ci{filter:none}
.chip.more{border-style:dashed;color:var(--muted)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-md);padding:11px 14px;
  font-size:13.5px;font-weight:650;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.in{background:var(--in);border-color:var(--in);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.wide{flex:1}
.btn.danger{color:var(--out);border-color:#4a2b25;background:var(--out-lo)}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- list / entries ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:0}
.entry{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--line);width:100%}
.entry:first-child{border-top:0}
.entry:active{background:var(--card2)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--card2)}
.entry .mid{flex:1;min-width:0}
.entry .cat{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .note{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.entry .amt{font-family:var(--num);font-size:14.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--in)}
.amt.out{color:var(--out)}
.empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
.empty b{color:var(--muted);font-weight:600}

/* history */
.daygroup{margin-bottom:12px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 5px 6px;gap:8px}
.dayhead .d1{font-size:12.5px;font-weight:650;color:var(--muted)}
.dayhead .d2{font-size:11px;color:var(--dim);font-family:var(--num)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 10px;border-radius:8px;font-size:12px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
select,input[type=month],input[type=date],input[type=text],textarea{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px;font-size:13.5px;color:var(--text);
  outline:none;min-height:40px;max-width:100%}
input[type=search]{appearance:none;-webkit-appearance:none;-webkit-text-fill-color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line)}
input[type=search]::-webkit-search-decoration,input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
input:focus,select:focus,textarea:focus{border-color:var(--dim);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:1px}
.card:focus-visible,.chip:focus-visible,.nav button:focus-visible{outline-offset:-2px}
input[type=month],input[type=date]{color-scheme:dark}
.search{width:100%;margin-bottom:8px}
.chip-f{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);border-radius:999px;padding:6px 10px;font-size:12px}
.chip-f.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:650}

/* shifts */
.band{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:3px 8px;border-radius:999px;white-space:nowrap}
.band i{width:5px;height:5px;border-radius:50%;background:currentColor}
.shift{width:100%;display:block;padding:12px 13px;border-top:1px solid var(--line);text-align:left}
.shift:first-child{border-top:0}
.shift:active{background:var(--card2)}
.shift .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shift .when{font-size:11px;color:var(--dim);letter-spacing:.02em}
.shift .net{font-family:var(--num);font-size:16px;font-weight:700}
.shift .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:11px;color:var(--muted)}
.shift .meta b{color:var(--text);font-family:var(--num);font-weight:650}
.shift .bar{height:4px;border-radius:3px;background:var(--card2);margin-top:9px;overflow:hidden}
.shift .bar>i{display:block;height:100%;border-radius:3px}
.ruler{position:relative;height:34px;margin-top:10px}
.ruler .track{position:absolute;left:0;right:0;top:12px;height:9px;border-radius:5px;overflow:hidden;display:flex}
.ruler .track i{height:100%}
.ruler .mark{position:absolute;top:2px;width:2px;height:28px;background:var(--text);border-radius:1px;transform:translateX(-1px)}
.ruler .mark::after{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--text)}
.ruler-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:1px;font-family:var(--num)}
.bucket{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.bucket:first-child{border-top:0}
.bucket .l{color:var(--muted)}
.bucket .r{font-family:var(--num);font-weight:650;white-space:nowrap}

/* summary */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 13px}
.stat .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--num);font-size:20px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.stat .s{font-size:10.5px;color:var(--dim);margin-top:2px}
.stat.in .v{color:var(--in)} .stat.out .v{color:var(--out)}
.stat.net{grid-column:1/-1;background:linear-gradient(135deg,var(--card2),var(--card))}
.stat.net .v{font-size:26px}
.bars{margin-top:10px}
.bar-row{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.bar-row .m{font-size:10.5px;color:var(--dim);font-family:var(--num);white-space:nowrap}
.barset{display:grid;gap:3px}
.bar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.bar.in>i{background:var(--in)} .bar.out>i{background:var(--out)}
.catrow{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .nm{font-size:12.5px;font-weight:550}
.catrow .tr{height:4px;background:var(--card2);border-radius:3px;margin-top:5px;overflow:hidden}
.catrow .tr>i{display:block;height:100%;background:var(--out);border-radius:3px}
.catrow .vv{font-family:var(--num);font-size:12.5px;font-weight:650;color:var(--out);white-space:nowrap}
.catrow .pc{font-size:10px;color:var(--dim);text-align:right;font-family:var(--num)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat .hd{font-size:10px;text-align:center;color:var(--dim);padding:1px 0;letter-spacing:.03em}
.heat .cell{border:0;padding:0;font:inherit;aspect-ratio:1/1;border-radius:8px;background:var(--card2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;font-size:10px;color:var(--muted);position:relative;overflow:hidden}
.heat .cell .n{font-size:10px;color:var(--dim);line-height:1.15;font-family:var(--num)}
.heat .cell.has .n{color:var(--text);font-weight:650}
.heat .cell .a{font-family:var(--num);font-size:9.5px;line-height:1.1;color:var(--text);opacity:.72;letter-spacing:-.3px}
.heat .cell.g1{background:color-mix(in srgb, var(--pos) 14%, transparent)}
.heat .cell.g2{background:color-mix(in srgb, var(--pos) 26%, transparent)}
.heat .cell.g3{background:color-mix(in srgb, var(--pos) 42%, transparent)}
.heat .cell.r1{background:color-mix(in srgb, var(--neg) 14%, transparent)}
.heat .cell.r2{background:color-mix(in srgb, var(--neg) 26%, transparent)}
.heat .cell.r3{background:color-mix(in srgb, var(--neg) 44%, transparent)}
html[data-theme="light"] .heat .cell.g1{background:color-mix(in srgb, var(--pos) 18%, transparent)}
html[data-theme="light"] .heat .cell.g2{background:color-mix(in srgb, var(--pos) 32%, transparent)}
html[data-theme="light"] .heat .cell.g3{background:color-mix(in srgb, var(--pos) 48%, transparent)}
html[data-theme="light"] .heat .cell.r1{background:color-mix(in srgb, var(--neg) 18%, transparent)}
html[data-theme="light"] .heat .cell.r2{background:color-mix(in srgb, var(--neg) 32%, transparent)}
html[data-theme="light"] .heat .cell.r3{background:color-mix(in srgb, var(--neg) 48%, transparent)}
.heat .cell.blank{background:transparent}
.heat .cell.future{opacity:.3}
.heat .cell.today{outline:1.5px solid var(--lime);outline-offset:-1.5px}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--dim);margin-top:8px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* settings */
.set-sec{margin-bottom:18px}
.set-title{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.set-body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row:last-child{padding-bottom:0}
.set-row .lbl{font-size:13px;font-weight:550}
.set-row .sub{font-size:11px;color:var(--dim);margin-top:1px}
.set-note{font-size:12px;color:var(--muted);line-height:1.55}
.kv{font-family:var(--num);font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 8px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--in);border-color:color-mix(in srgb, var(--pos) 30%, transparent);background:var(--in-lo)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 30%, transparent);background:color-mix(in srgb, var(--warn) 12%, transparent)}
.tag.err{color:var(--out);border-color:color-mix(in srgb, var(--neg) 30%, transparent);background:var(--out-lo)}
.cat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cat-edit{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:6px 8px;font-size:12px}
.cat-edit button{color:var(--dim);font-size:14px;line-height:1;padding:0 1px}
.cat-edit button:hover{color:var(--out)}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{flex:1;min-width:0;min-height:38px;width:100%}
.inline-add button{white-space:nowrap;padding:0 12px;border-radius:10px;background:var(--lime);color:var(--lime-ink);font-weight:650;font-size:12.5px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:transparent;
  border-top:1px solid var(--chrome-line);
  padding:6px 8px calc(8px + max(env(safe-area-inset-bottom, 0px), 14px));
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease)}
.nav.scrolled{background:var(--chrome-bg);box-shadow:var(--lift-up)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:10px;color:var(--dim);font-size:10px;font-weight:600;line-height:1.2}
.nav button svg{width:20px;height:20px}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--lime)}
.nav button.on svg{stroke:var(--lime)}

/* ---------- bottom sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);animation:fade .16s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
  transition:transform var(--dur) var(--ease);
  border-radius:20px 20px 0 0;max-height:93dvh;display:flex;flex-direction:column;
  animation:up .2s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--safe-b)}
@media(min-width:600px){.sheet{max-width:520px;margin:0 auto;border-radius:20px 20px 0 0}}
.sheet-grab{padding:10px 0 2px;display:grid;place-items:center;flex:none}
.sheet-grab i{width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px;flex:none}
.sheet-title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.sheet-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);font-size:16px}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:8px 16px 14px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--bg2)}
.amt-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:4px 0 10px}
.amt-cur{font-family:var(--num);font-size:20px;color:var(--muted);font-weight:600}
.amt-input{width:auto;max-width:240px;min-width:80px;field-sizing:content;background:transparent;border:0;
  outline:none;text-align:center;font-family:var(--num);font-size:40px;font-weight:700;letter-spacing:-1.5px;
  color:var(--text);padding:0;min-height:48px;border-bottom:1.5px solid transparent}
.amt-input:focus{border-bottom-color:var(--line);box-shadow:none}
.amt-input::placeholder{color:#3f4a44}
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.presets button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 0;
  font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--muted)}
.presets button:active{background:var(--card2);color:var(--text)}
.field-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:12px 0 7px;display:flex;justify-content:space-between;align-items:center}
.field-label .hl{color:var(--warn);text-transform:none;letter-spacing:0;font-size:11px}
.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);min-height:38px}
.cat-pick button.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:650}
.cat-pick button .ci{font-size:13px}
.cat-pick button.new{border-style:dashed}
.notes{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row2>*{min-width:0}
.row2 input{width:100%;min-width:0}
.sheet-err{font-size:12px;color:var(--out);margin-top:8px;min-height:1px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,14px);z-index:55;
  background:#e9f2df;color:#10150a;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
  max-width:min(440px,calc(100vw - 28px));display:flex;align-items:center;gap:10px;line-height:1.35}
.toast>span{flex:1;min-width:0}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.undo.show{pointer-events:auto}
.toast.undo button{background:#10150a;color:#e9f2df;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
/* ---------- dashboard (desktop) ---------- */
.dash{display:block}
.dash-a,.dash-b{min-width:0}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--muted);flex:none}
.icon-btn:active{background:var(--card2);color:var(--text)}
.add-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);color:var(--lime-ink);
  border-radius:999px;height:36px;padding:0 13px;font-weight:700;font-size:13px;flex:none}
.add-btn:active{transform:scale(.97)}
.add-btn .plus{font-size:17px;line-height:1;margin-top:-1px}
.add-btn .add-label{display:none}
.hero-delta{font-size:11px;color:var(--dim);margin-top:5px;font-family:var(--num)}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wk .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.wk .v{font-family:var(--font-head);font-size:14px;font-weight:700;margin-top:2px;letter-spacing:-.2px;white-space:nowrap}
.floor{font-size:11px;margin-top:8px;line-height:1.4}
.floor b{font-family:var(--num);font-weight:700}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.split>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.split .sk{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.split .sv{font-family:var(--num);font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-foot{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--dim);padding:2px 4px 6px}
.trend-foot b{color:var(--text);font-family:var(--num);font-weight:650}
.fundrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.fundrow:first-child{border-top:0;padding-top:0}
.fundrow.total{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.fundrow .k{font-size:11.5px;font-weight:650;color:var(--text)}
.fundrow .s{font-size:10px;color:var(--dim);margin-top:1px}
.fundrow .bal{font-family:var(--num);font-size:16px;font-weight:700;white-space:nowrap}
.fund{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fund .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.fund .v{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--lime);margin-top:2px}
.fund .s{font-size:10.5px;color:var(--dim);margin-top:1px}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .nav,.topbar{background:rgba(20,26,22,.97)}
}

/* calculator */
.suggest{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sug{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  background:var(--card);border:1px solid var(--line)}
.sug-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--card2);flex:none}
.sug-main{flex:1;min-width:0}
.sug-t{font-size:12.5px;font-weight:650;line-height:1.3}
.sug-s{font-size:11px;color:var(--dim);margin-top:2px}
.sug-go{flex:none;border:0;border-radius:10px;background:var(--lime);color:var(--lime-ink);
  font-size:11.5px;font-weight:700;padding:8px 11px;font-family:inherit}
.sug-x{flex:none;border:0;background:none;color:var(--dim);font-size:18px;padding:2px 4px;line-height:1}
.calc{display:flex;flex-direction:column;gap:14px;padding:4px 0 6px}
.calc-expr{min-height:18px;text-align:right;font-family:var(--num);font-size:12.5px;color:var(--dim);
  overflow-x:auto;white-space:nowrap;padding:0 4px}
.calc-out{text-align:right;font-family:var(--num);font-size:42px;font-weight:700;letter-spacing:-1.5px;
  line-height:1.1;padding:0 4px;overflow-x:auto;white-space:nowrap}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-pad button{min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  color:var(--text);font-family:var(--num);font-size:21px;font-weight:600;display:grid;place-items:center}
.calc-pad button:active{background:var(--card2)}
.calc-pad button.op{color:var(--lime);font-weight:700}
.calc-pad button.fn{color:var(--muted);font-size:16px}
.calc-pad button.eq{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:800}
.calc-pad button.zero{grid-column:span 2}
.narrow{max-width:780px}
@media(min-width:1024px){.narrow{margin:0 auto}}
.mini-row{display:flex;gap:16px;font-size:11px;color:var(--muted);padding:9px 3px 0}
.mini-row b{color:var(--text);font-family:var(--num);font-weight:650}

@media(min-width:1024px){
  .shell{max-width:1180px;padding:0 28px 44px}
  #view{padding-top:var(--s5)}
  /* full-bleed chrome: the bar spans the window, its content stays in the column */
  .topbar,.nav{
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    padding-left:calc(50vw - 50%);
    padding-right:calc(50vw - 50%);
  }
  .topbar{position:sticky;top:0;z-index:49;margin-top:0;margin-bottom:0;padding-top:18px;padding-bottom:14px;
    background:transparent;border-bottom:1px solid transparent}
  .topbar.scrolled{background:var(--chrome-bg);border-bottom-color:var(--chrome-line);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.28)}
  .add-btn{height:38px;padding:0 16px}
  .add-btn .add-label{display:inline}
  .dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:26px;align-items:start}
  .dash-a,.dash-b{display:flex;flex-direction:column;min-width:0}
  .hero{text-align:left;padding:24px 26px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:var(--s4)}
  .hero-date{margin:0 0 2px}
  .hero-net{font-size:58px;margin-top:10px;letter-spacing:-2.5px}
  .hero-label{margin-top:0}
  .hero-split{justify-content:flex-start;margin-top:14px}
  .strip{padding:0;margin:0 0 var(--s4)}
  .strip-day{flex:0 0 66px;max-width:66px}
  .card{margin-bottom:2px}
  .dash-b .section-head:first-child{margin-top:0}
  .heat{max-width:520px}
  .toast{bottom:24px}
}
@media(min-width:760px){
  .shell{padding-bottom:32px;padding-top:0}
  .topbar{padding-top:16px}
  .nav{position:sticky;top:var(--topbar-offset,68px);bottom:auto;transition:top var(--dur) var(--ease);padding:0;border-top:0;
    border-bottom:1px solid var(--chrome-line);background:transparent;z-index:48}
  .nav.scrolled{background:var(--chrome-bg);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.28)}
  .nav-in{grid-template-columns:repeat(5,auto);justify-content:center;gap:6px;padding:6px 0;max-width:560px}
  .nav button{flex-direction:row;gap:7px;font-size:12.5px;padding:8px 14px}
  .nav button svg{width:17px;height:17px}
  .toast{bottom:24px}
}
@media(max-width:389px){
  .brand-sub{display:none}
  .brand-name{font-size:14px}
  .sync-chip{padding:7px 9px;font-size:11px}
}
@media(max-width:359px){
  .presets{grid-template-columns:repeat(3,1fr)}
  .entry .amt{font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="34" height="34" role="img" aria-label="Baki">
          <rect width="100" height="100" rx="23" style="fill:var(--accent)"/>
          <circle cx="50" cy="50" r="33" style="fill:var(--accent-ink)"/>
          <path d="M35.5 50.5 L45.5 61 L64.5 38.5" fill="none" style="stroke:var(--accent)" stroke-width="9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Baki</div>
        <div class="brand-sub" id="brandSub">what your shift really pays</div>
      </div>
    </div>
    <button class="icon-btn" data-act="openCalc" aria-label="Calculator" title="Calculator">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="2.5"/>
        <path d="M7.5 7.5h9"/>
        <path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01M8 15h.01M12 15h.01M16 15h.01M8 18.5h.01M12 18.5h.01M16 18.5h.01"/>
      </svg>
    </button>
    <button class="add-btn" data-act="openAction" aria-label="Add a shift or spending">
      <span class="plus">＋</span><span class="add-label">Add</span>
    </button>
    <button class="sync-chip" data-act="openSync" title="Sync status">
      <span class="sync-dot" id="syncDot"></span><span id="syncText">checking…</span>
    </button>
  </header>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button data-tab="today" class="on" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Spending</span>
    </button>
    <button data-tab="shifts">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>
      <span>Shifts</span>
    </button>
    <button data-tab="summary">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Summary</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>More</span>
    </button>
  </div>
</nav>
  <main id="view"></main>
</div>



<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-back" data-act="closeSheet"></div>
  <section class="sheet">
    <div class="sheet-grab" data-act="closeSheet"><i></i></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">Add expense</div>
      <button class="sheet-x" data-act="closeSheet" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============================================================
   Baki — single-file daily tracker (localStorage + optional sync server)
   Amounts are stored as integer cents. Dates as local YYYY-MM-DD.
   ============================================================ */

/* ---------- defaults ---------- */
const DEFAULT_CATS = {
  in: [
    { id: 'earnings', name: 'Grab earnings', icon: '🟢' },
    { id: 'tips',      name: 'Tips',          icon: '💵' },
    { id: 'bonus',     name: 'Bonus',         icon: '🏆' },
    { id: 'cash',      name: 'Cash fare',     icon: '🪙' },
    { id: 'otherin',   name: 'Other income',  icon: '➕' },
  ],
  out: [
    { id: 'fuel',        name: 'Petrol',      icon: '⛽' },
    { id: 'toll',        name: 'Toll',        icon: '🛣️' },
    { id: 'parking',     name: 'Parking',     icon: '🅿️' },
    { id: 'carwash',     name: 'Car wash',    icon: '🧼' },
    { id: 'maintenance', name: 'Maintenance', icon: '🔧' },
    { id: 'grabfee',     name: 'Grab insurance', icon: '🛡️' },
    { id: 'roadtax',     name: 'Road tax',    icon: '📄' },
    { id: 'phone',       name: 'Phone / data',icon: '📱' },
    { id: 'food',        name: 'Food',        icon: '🍚' },
    { id: 'other',       name: 'Other',       icon: '📦' },
  ],
};
const DEFAULT_PROFIT = {
  fuelPrice: 1.99,     // RM per litre, RON95 under BUDI95
  kmPerLitre: 14,      // typical 1.3–1.5L city figure
  wearPerKm: 0.09,     // tyres, oil, brakes, shocks, CVT, wash — sinking fund
  targetRate: 18,      // RM net per hour you refuse to work below
  avgSpeed: 30,        // km/h, only used when odometer isn't given
  grabInsurance: 7.5,  // RM per shift — Grab bills this separately, so it is a real cash cost
};
const STORE_KEY = 'grabmoney.v1';
const SERVER_URL_KEY = 'grabmoney.server';
const BACKUP_KEY = 'grabmoney.lastbackup';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- helpers ---------- */
function pad(n){ return String(n).padStart(2, '0'); }
function toISO(d = new Date()){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function fromISO(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n){ const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function startOfMonth(iso){ return iso.slice(0, 7) + '-01'; }
function daysInMonth(month){ const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function monthLabel(month, long = false){
  const [y, m] = month.split('-').map(Number);
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return (long ? names[m - 1] : names[m - 1].slice(0, 3)) + ' ' + String(y).slice(2);
}
function weekday(iso){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][fromISO(iso).getDay()]; }
function weekdayLong(iso){ return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][fromISO(iso).getDay()]; }
function dayNum(iso){ return Number(iso.slice(8, 10)); }
function parseCents(str){
  if (typeof str === 'number') return Math.round(str * 100);
  const s = String(str).replace(/[^0-9.]/g, '');
  if (!s) return null;
  const parts = s.split('.');
  const whole = parts[0] === '' ? 0 : parseInt(parts[0], 10);
  let frac = (parts[1] || '').slice(0, 2);
  if (parts[1] !== undefined && parts[1].length > 2) return null;
  frac = (frac + '00').slice(0, 2);
  if (!Number.isFinite(whole)) return null;
  return whole * 100 + parseInt(frac, 10);
}
function rm(cents, opts = {}){
  const neg = cents < 0;
  const abs = Math.abs(Math.round(cents));
  const s = (abs / 100).toLocaleString('en-MY', {
    minimumFractionDigits: opts.cents === false ? 0 : 2,
    maximumFractionDigits: opts.cents === false ? 0 : 2,
  });
  return (neg ? '−' : '') + (opts.bare ? '' : 'RM ') + s;
}
/** ringgit → the cents rm() expects (keeps call sites readable). */
function rmR(ringgit, opts){ return rm(Math.round(ringgit * 100), opts); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }
function sum(list, f){ return list.reduce((a, x) => a + f(x), 0); }

/* ---------- state ---------- */
const state = {
  data: null,          // full store { v, entries[], settings{} }
  sync: { status: 'checking', text: 'checking…', server: false, version: null, busy: false, error: '' },
  view: 'today',
  dayDate: todayISO(),
  month: todayISO().slice(0, 7),
  shiftMonth: todayISO().slice(0, 7),
  filters: { month: todayISO().slice(0, 7), type: 'all', cat: 'all', q: '', catsOpen: false },
  shiftSheet: null,  // { id?, date, start, hours, odoStart, odoEnd, km, gross, incentive, extra, note, err }
  sheet: { open: false, type: 'expense', cat: '', amount: '', note: '', date: todayISO(), err: '', editing: null },
};
let saveTimer = null, pollTimer = null, pendingWrite = false;
let offlineQueue = false;   // changes made while the server was unreachable
let reconnectTimer = null;

/* ---------- storage ---------- */
function emptyData(){
  return {
    v: 1,
    updatedAt: new Date().toISOString(),
    entries: [],
    shifts: [],
    settings: { cats: clone(DEFAULT_CATS), name: '', profit: clone(DEFAULT_PROFIT) },
  };
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normalizeStore(raw){
  if (!raw || typeof raw !== 'object') return null;
  // one insurance only: fold the old annual "Car insurance" category into Maintenance
  // (both drain the wear fund), and call the daily one "Grab insurance"
  if (raw.settings && raw.settings.cats && Array.isArray(raw.settings.cats.out)) {
    raw = JSON.parse(JSON.stringify(raw));
    const hadInsurance = raw.settings.cats.out.some(c => c && c.id === 'insurance');
    raw.settings.cats.out = raw.settings.cats.out
      .filter(c => !(c && c.id === 'insurance'))
      .map(c => (c && c.id === 'grabfee' && /cover/i.test(String(c.name || ''))) ? { ...c, name: 'Grab insurance' } : c);
    if (Array.isArray(raw.entries)) {
      raw.entries = raw.entries.map(e => {
        if (!e) return e;
        if (hadInsurance && e.cat === 'insurance') return { ...e, cat: 'maintenance' };
        if (e.cat === 'grabfee' && /^grab cover$/i.test(String(e.note || '').trim())) return { ...e, note: 'Grab insurance' };
        return e;
      });
    }
  }
  const entries = Array.isArray(raw.entries) ? raw.entries.filter(e =>
    e && typeof e === 'object' && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) &&
    Number.isFinite(Number(e.amount)) && Number(e.amount) > 0
  ).map(e => ({
    id: String(e.id || uid()),
    date: e.date,
    type: e.type === 'income' ? 'income' : 'expense',
    cat: String(e.cat || (e.type === 'income' ? 'otherin' : 'other')),
    amount: Math.round(Number(e.amount)),
    note: String(e.note || ''),
    updated: e.updated || e.created || '1970-01-01T00:00:00.000Z',
    ...(e.sample ? { sample: true } : {}),
  })) : [];
  const cats = raw.settings && raw.settings.cats;
  const profitRaw = (raw.settings && raw.settings.profit) || {};
  const profit = { ...clone(DEFAULT_PROFIT) };
  for (const k of Object.keys(DEFAULT_PROFIT)) {
    const n = Number(profitRaw[k]);
    if (Number.isFinite(n) && n >= 0) profit[k] = n;
  }
  const shifts = Array.isArray(raw.shifts) ? raw.shifts.filter(s =>
    s && typeof s === 'object' && typeof s.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date) &&
    Number.isFinite(Number(s.gross)) && Number(s.gross) >= 0
  ).map(s => ({
    id: String(s.id || uid()),
    date: s.date,
    start: typeof s.start === 'string' && /^\d{2}:\d{2}$/.test(s.start) ? s.start : '',
    hours: Math.min(24, Math.max(0, Number(s.hours) || 0)),
    odoStart: s.odoStart === '' || s.odoStart == null ? null : Math.max(0, Number(s.odoStart) || 0),
    odoEnd: s.odoEnd === '' || s.odoEnd == null ? null : Math.max(0, Number(s.odoEnd) || 0),
    km: Math.max(0, Number(s.km) || 0),
    gross: Math.round(Number(s.gross)),
    incentive: Math.max(0, Math.round(Number(s.incentive) || 0)),
    extra: Math.max(0, Math.round(Number(s.extra) || 0)),
    kmPerLitre: Number(s.kmPerLitre) > 0 ? Number(s.kmPerLitre) : null,
    grabFee: Number.isFinite(Number(s.grabFee)) ? Math.max(0, Math.round(Number(s.grabFee))) : null,
    note: String(s.note || ''),
    updated: s.updated || '1970-01-01T00:00:00.000Z',
    ...(s.sample ? { sample: true } : {}),
  })) : [];
  return {
    v: 1,
    updatedAt: raw.updatedAt || new Date().toISOString(),
    entries,
    shifts,
    settings: {
      name: (raw.settings && raw.settings.name) || '',
      cats: {
        in: (cats && Array.isArray(cats.in) && cats.in.length) ? cats.in : clone(DEFAULT_CATS.in),
        out: (cats && Array.isArray(cats.out) && cats.out.length) ? cats.out : clone(DEFAULT_CATS.out),
      },
      profit,
    },
  };
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    return normalizeStore(JSON.parse(raw));
  } catch (e) { console.warn('load failed', e); return null; }
}
function saveLocal(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.data)); }
  catch (e) { console.warn('save failed', e); return false; }
  snapshotTick();
  return true;
}

/* ---------- storage durability ---------- */
let storageInfo = { supported: false, persisted: false, usage: 0, quota: 0 };

async function refreshStorageInfo(){
  try {
    if (!navigator.storage) return;
    storageInfo.supported = true;
    if (navigator.storage.persisted) storageInfo.persisted = await navigator.storage.persisted();
    if (navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      storageInfo.usage = e.usage || 0;
      storageInfo.quota = e.quota || 0;
    }
  } catch (e) { /* private mode, old browser — just report what we know */ }
}
/** Ask the browser not to evict this origin's data under storage pressure. */
async function ensurePersistence(){
  try {
    if (!navigator.storage || !navigator.storage.persist) return false;
    if (navigator.storage.persisted && await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (e) { return false; }
}
function fmtBytes(n){
  if (!n) return '0 KB';
  if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

/* ---------- rolling local snapshots (undo history that survives a bad edit) ---------- */
const SNAP_KEY = 'baki.snapshots';
const SNAP_MAX = 7;
const SNAP_EVERY = 60 * 60 * 1000;   // at most one per hour
const SNAP_MAX_BYTES = 240 * 1024;

function readSnaps(){
  try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; }
}
function writeSnaps(list){
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
/** Keep a rolling set of restore points without thinking about it. */
function snapshotTick(force){
  try {
    if (!state.data) return;
    const n = state.data.entries.length + (state.data.shifts || []).length;
    if (!n) return;
    const list = readSnaps();
    const last = list[0] ? Date.parse(list[0].at) : 0;
    if (!force && Date.now() - last < SNAP_EVERY) return;
    const blob = JSON.stringify(state.data);
    if (blob.length > SNAP_MAX_BYTES) return;
    list.unshift({
      at: new Date().toISOString(),
      entries: state.data.entries.length,
      shifts: (state.data.shifts || []).length,
      size: blob.length,
      data: JSON.parse(blob),
    });
    writeSnaps(list.slice(0, SNAP_MAX));
  } catch (e) { /* never let housekeeping break a save */ }
}
/** Snapshots are additive: restoring adds rows back, it never deletes what you have now. */
function restoreSnapshot(at){
  const snap = readSnaps().find(s => s.at === at);
  if (!snap) { toast('That snapshot is gone', 2600); return; }
  const before = state.data.entries.length + (state.data.shifts || []).length;
  const merged = mergeStores(state.data, normalizeStore(snap.data) || { entries: [], shifts: [], settings: state.data.settings });
  const after = merged.entries.length + (merged.shifts || []).length;
  state.data = merged;
  state.data.updatedAt = new Date().toISOString();
  saveNow({ undeleteIds: [
    ...snap.data.entries.map(e => e.id),
    ...(snap.data.shifts || []).map(x => x.id),
  ] });
  render();
  toast(`Snapshot restored · ${Math.max(0, after - before)} added, ${after} total`, 3200);
}
function catById(type, id){
  const list = state.data.settings.cats[type === 'income' ? 'in' : 'out'];
  return list.find(c => c.id === id) || null;
}
function catName(type, id){ const c = catById(type, id); return c ? c.name : 'Other'; }
function catIcon(type, id){ const c = catById(type, id); return c ? c.icon : (type === 'income' ? '🟢' : '📦'); }

/* ---------- day maths ---------- */
function entriesOn(iso, type){
  return state.data.entries.filter(e => e.date === iso && (!type || e.type === type));
}
/**
 * Cash totals. Shift payouts are income and shift tolls are cash out, so a
 * driver never has to re-type the payout as an income entry.
 */
function dayTotals(iso){
  const list = entriesOn(iso);
  const shifts = (state.data.shifts || []).filter(x => x.date === iso);
  const income  = sum(list.filter(e => e.type === 'income'),  e => e.amount) + sum(shifts, x => x.gross || 0);
  const expense = sum(list.filter(e => e.type === 'expense'), e => e.amount) + sum(shifts, x => x.extra || 0);
  return { income, expense, net: income - expense, count: list.length, shiftCount: shifts.length };
}
function monthEntries(month){ return state.data.entries.filter(e => e.date.startsWith(month)); }
function monthTotals(month){
  const list = monthEntries(month);
  const shifts = (state.data.shifts || []).filter(x => x.date.startsWith(month));
  const income  = sum(list.filter(e => e.type === 'income'),  e => e.amount) + sum(shifts, x => x.gross || 0);
  const expense = sum(list.filter(e => e.type === 'expense'), e => e.amount) + sum(shifts, x => x.extra || 0);
  return { income, expense, net: income - expense, count: list.length, shiftCount: shifts.length };
}
/** Fuel and wear funds: accrued from km, drained by real spending. */
function fundStats(month){
  const cfg = profitCfg();
  const shifts = (state.data.shifts || []).filter(s => !month || s.date.startsWith(month));
  let fuelAcc = 0, wearAcc = 0;
  shifts.forEach(sh => { const m = shiftMetrics(sh, cfg); fuelAcc += m.fuel; wearAcc += m.wear; });
  const ents = (state.data.entries || []).filter(e => e.type === 'expense' && (!month || e.date.startsWith(month)));
  const fuelSpent = sum(ents.filter(e => e.cat === 'fuel'), e => e.amount) / 100;
  const wearSpent = sum(ents.filter(e => ['maintenance', 'carwash', 'roadtax'].includes(e.cat)), e => e.amount) / 100;
  return {
    fuel: { acc: fuelAcc, spent: fuelSpent, bal: fuelAcc - fuelSpent },
    wear: { acc: wearAcc, spent: wearSpent, bal: wearAcc - wearSpent },
  };
}

/* ---------- sync layer ---------- */
function serverUrl(){
  const saved = localStorage.getItem(SERVER_URL_KEY);
  if (saved) return saved.replace(/\/+$/, '');
  if (location.protocol.startsWith('http')) return location.origin;
  return '';
}
function themePref(){
  try { return localStorage.getItem('baki.theme') || 'auto'; } catch (e) { return 'auto'; }
}
function applyTheme(){
  const pref = themePref();
  const mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  const sysLight = !!(mql && mql.matches);
  const light = pref === 'light' || (pref === 'auto' && sysLight);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', light ? '#eef1e6' : '#0b0f0d');
  document.querySelectorAll('[data-act="setTheme"]').forEach(b => b.classList.toggle('on', b.dataset.mode === pref));
}
function setTheme(mode){
  try { localStorage.setItem('baki.theme', mode); } catch (e) {}
  applyTheme();
  toast(mode === 'auto' ? 'Theme follows your system' : 'Theme: ' + mode, 2400);
}
function setSync(status, text){
  state.sync.status = status;
  state.sync.text = text;
  updateSyncChip();
}
async function pingServer(){
  const base = state.sync.server || serverUrl();
  if (!base) return false;
  try {
    const r = await fetch(base + '/api/ping', { cache: 'no-store', signal: AbortSignal.timeout(2500) });
    if (!r.ok) return false;
    const j = await r.json();
    state.sync.server = base;
    state.sync.version = j.version;
    state.sync.hasData = !!j.entries;
    return true;
  } catch (e) { return false; }
}
async function pullServer(){
  const r = await fetch(state.sync.server + '/api/data', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
  if (!r.ok) throw new Error('load ' + r.status);
  const j = await r.json();
  state.sync.version = j.version;
  state.sync.dead = { ids: (j.tomb && j.tomb.ids) || [], cats: (j.tomb && j.tomb.cats) || [] };
  return j.data ? normalizeStore(j.data) : null;
}
let pendingDeletes = [];
let pendingUndeletes = [];
function queueDelete(id){ if (id) pendingDeletes.push(String(id)); }
function queueUndelete(id){ if (id) pendingUndeletes.push(String(id)); }

async function pushServer(opts = {}){
  if (!state.sync.server) return false;
  const body = { data: state.data, replace: !!opts.replace };
  const deadIds = [...new Set([...(opts.deletedIds || []), ...pendingDeletes])];
  const liveIds = [...new Set([...(opts.undeleteIds || []), ...pendingUndeletes])].filter(id => !deadIds.includes(id));
  pendingDeletes = [];
  pendingUndeletes = [];
  if (deadIds.length) body.deletedIds = deadIds;
  if (liveIds.length) body.undeleteIds = liveIds;
  if (opts.deletedCats && opts.deletedCats.length) body.deletedCats = opts.deletedCats;

  const r = await fetch(state.sync.server + '/api/data', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(8000),
  });
  if (!r.ok) throw new Error('save ' + r.status);
  const j = await r.json();
  state.sync.version = j.version;
  if (j.tomb) state.sync.dead = { ids: j.tomb.ids || [], cats: j.tomb.cats || [] };
  if (j.data) state.data = normalizeStore(j.data);
  return true;
}
function queueSave(){
  pendingWrite = true;
  setSync(state.sync.server ? 'synced' : 'local', state.sync.server ? 'synced' : 'on this device');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveLocal();
    if (state.sync.server) {
      try {
        await pushServer();
        pendingWrite = false;
        setSync('synced', 'synced');
      } catch (e) {
        pendingWrite = false;
        offlineQueue = true;
        setSync('local', 'saved · will sync');
        console.warn('push failed', e);
      }
    } else {
      pendingWrite = false;
    }
  }, 350);
}
async function saveNow(opts = {}){
  clearTimeout(saveTimer);
  saveLocal();
  if (!state.sync.server) { setSync('local', 'on this device'); return; }
  try {
    await pushServer(opts);
    offlineQueue = false;
    setSync('synced', 'synced');
  } catch (e) {
    offlineQueue = true;
    setSync('local', 'saved · will sync');
    console.warn('save failed', e);
  }
}
function mergeStores(a, b, dead = {}){
  const deadIds = new Set(dead.ids || []);
  const deadCats = new Set(dead.cats || []);
  const byId = new Map();
  [...(a.entries || []), ...(b.entries || [])].forEach(e => {
    if (deadIds.has(e.id)) return;
    const cur = byId.get(e.id);
    if (!cur || (e.updated || '') > (cur.updated || '')) byId.set(e.id, e);
  });
  const shiftById = new Map();
  [...(a.shifts || []), ...(b.shifts || [])].forEach(x => {
    if (deadIds.has(x.id)) return;
    const cur = shiftById.get(x.id);
    if (!cur || (x.updated || '') > (cur.updated || '')) shiftById.set(x.id, x);
  });
  const mergeCats = (x = [], y = []) => {
    const m = new Map();
    [...x, ...y].forEach(c => { if (c && c.id && !deadCats.has(c.id)) m.set(c.id, c); });
    return [...m.values()];
  };
  const pa = a.settings.profit || {}, pb = b.settings.profit || {};
  return {
    v: 1,
    updatedAt: new Date().toISOString(),
    entries: [...byId.values()],
    shifts: [...shiftById.values()],
    settings: {
      name: b.settings.name || a.settings.name,
      cats: {
        in: mergeCats(a.settings.cats.in, b.settings.cats.in),
        out: mergeCats(a.settings.cats.out, b.settings.cats.out),
      },
      profit: { ...clone(DEFAULT_PROFIT), ...pa, ...pb },
    },
  };
}

async function initSync(){
  const base = serverUrl();
  if (!base) { setSync('local', 'on this device'); return; }
  const ok = await pingServer();
  if (!ok) {
    state.sync.server = '';
    setSync('local', 'on this device');
    return;
  }
  state.sync.server = base;
  try {
    const remote = await pullServer();
    if (remote) {
      state.data = state.data ? mergeStores(state.data, remote, state.sync.dead || {}) : remote;
      saveLocal();
      await pushServer();
    } else if (state.data.entries.length || state.data.shifts.length) {
      // this device has data and the shared file is empty: publish it
      await pushServer();
    }
    setSync('synced', 'synced');
    render();
    poll();
  } catch (e) {
    setSync('local', 'offline · saved');
  }
}
function poll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden || !state.sync.server || pendingWrite) return;
    try {
      const r = await fetch(state.sync.server + '/api/ping', { cache: 'no-store', signal: AbortSignal.timeout(3000) });
      if (!r.ok) throw new Error('ping');
      const j = await r.json();
      if (j.version && j.version !== state.sync.version) {
        const remote = await pullServer();
        if (remote) {
          state.data = mergeStores(state.data, remote, state.sync.dead || {});
          saveLocal();
          state.sync.server && await pushServer();
          render();
        }
      }
      if (state.sync.status !== 'synced') setSync('synced', 'synced');
    } catch (e) {
      if (state.sync.server) setSync('local', 'offline · saved');
    }
    if (offlineQueue) tryReconnect();
  }, 12000);
}

/* ---------- entry ops ---------- */
function upsertEntry(patch){

    });
  }
  state.data.updatedAt = now;

}
function deleteEntry(id){

  const [removed] = state.data.entries.splice(i, 1);

}
function restoreEntry(entry){

/* ---------- shift economics ---------- */
function profitCfg(){
  return { ...clone(DEFAULT_PROFIT), ...((state.data.settings && state.data.settings.profit) || {}) };
}
/** RM per km, split into fuel and wear. */
const TRAFFIC = [
  { id: 'smooth', label: 'Smooth', km: 14, hint: 'highway / light traffic' },
  { id: 'mixed',  label: 'Mixed',  km: 12, hint: 'steady city driving' },
  { id: 'jam',    label: 'Jam',    km: 11, hint: 'gridlock, lots of idling' },
];
/** Fuel and wear cost per km; an explicit km/L overrides the default. */
function costRates(cfg = profitCfg(), kmPerLitre){
  const eff = Number(kmPerLitre) > 0 ? Number(kmPerLitre) : cfg.kmPerLitre;
  const fuel = eff > 0 ? cfg.fuelPrice / eff : 0;
  return { fuel, wear: cfg.wearPerKm, total: fuel + cfg.wearPerKm, kmPerLitre: eff };
}
let _topbarH = 0;
function syncTopbarHeight(){
  const el = document.querySelector('.topbar');
  if (!el) return;
  const h = el.offsetHeight;
  if (h && h !== _topbarH) {
    _topbarH = h;
    document.documentElement.style.setProperty('--topbar-h', h + 'px');
  }
}

function updateProfitDisplay(){
  const cfg = profitCfg();
  const c = costRates(cfg);
  const sub = $('#profitFuelSub'), total = $('#profitTotal');
  if (sub) sub.textContent = `fuel RM ${c.fuel.toFixed(3)} + wear RM ${cfg.wearPerKm.toFixed(3)}`;
  if (total) total.textContent = `RM ${c.total.toFixed(3)}/km`;
}
function shiftKm(sh, cfg = profitCfg()){
  if (sh.odoStart != null && sh.odoEnd != null && sh.odoEnd >= sh.odoStart) return Math.max(0, sh.odoEnd - sh.odoStart);
  if (sh.km > 0) return sh.km;
  return (Number(sh.hours) || 0) * (cfg.avgSpeed || 30);
}
function shiftMetrics(sh, cfg = profitCfg()){
  const c = costRates(cfg, sh.kmPerLitre);
  const km = shiftKm(sh, cfg);
  const fuel = km * c.fuel;
  const wear = km * c.wear;
  const running = fuel + wear;
  // money fields are stored in cents; convert to ringgit for the maths
  const gross = (sh.gross || 0) / 100 + (sh.incentive || 0) / 100;
  const extra = (sh.extra || 0) / 100;
  // Grab's daily insurance is billed per shift; fall back to the configured default
  const grabFee = (sh.grabFee == null ? (cfg.grabInsurance || 0) : sh.grabFee / 100);
  const net = gross - running - extra - grabFee;
  const hrs = Number(sh.hours) || 0;
  const netHr = hrs > 0 ? net / hrs : null;
  return {
    km, fuel, wear, running, net, hrs, netHr, gross,
    takeHome: net, fuelPerKm: c.fuel, kmPerLitre: c.kmPerLitre, grabFee, extraCost: extra,
    grossHr: hrs > 0 ? gross / hrs : null,
    grossPerKm: km > 0 ? gross / km : null,
    netPerKm: km > 0 ? net / km : null,
    band: netHr == null ? 'none' : bandFor(netHr, cfg),
  };
}
function bandFor(rate, cfg = profitCfg()){
  if (rate < 12) return 'quiet';
  if (rate < 15) return 'slow';
  if (rate < 20) return 'steady';
  if (rate < 25) return 'good';
  return 'peak';
}
const BANDS = {
  quiet:  { label: 'Quiet',  color: 'var(--neg)', ink: 'var(--bg)', hint: 'Below RM12/hr net — quiet hours are costing you car value. Park or go home.' },
  slow:   { label: 'Slow',   color: 'var(--warn)', ink: 'var(--bg)', hint: 'RM12–15/hr — only worth it if you are already nearby and avoiding dead miles.' },
  steady: { label: 'Steady', color: 'color-mix(in srgb, var(--warn) 45%, var(--pos))', ink: 'var(--bg)', hint: 'RM15–20/hr — acceptable but under your target. Try a peak window.' },
  good:   { label: 'Good',   color: 'var(--pos)', ink: 'var(--bg)', hint: 'RM20–25/hr — this is a solid, sustainable shift.' },
  peak:   { label: 'Peak',   color: 'var(--accent)', ink: 'var(--bg)', hint: 'Above RM25/hr — repeat this window and hotspot.' },
  none:   { label: '—',      color: 'var(--line)', ink: 'var(--muted)', hint: 'Add hours to get a rate.' },
};
function bucketFor(start){
  if (!start) return 'unspecified';
  const [h, m] = start.split(':').map(Number);
  const t = h + m / 60;
  if (t >= 5 && t < 6.5) return 'early';
  if (t >= 6.5 && t < 9.5) return 'am';
  if (t >= 9.5 && t < 12) return 'midday';
  if (t >= 12 && t < 16) return 'afternoon';  // 2–4pm dead zone sits here
  if (t >= 16 && t < 20) return 'pm';
  return 'night';
}
const BUCKETS = {
  early: 'Before 6:30am', am: 'Morning rush 6:30–9:30', midday: 'Late morning 9:30–12',
  afternoon: 'Afternoon 12–4 (dead)', pm: 'Evening peak 5–8pm', night: 'Night 8pm+', unspecified: 'No start time',
};
function monthShifts(month){ return (state.data.shifts || []).filter(s => s.date.startsWith(month)); }
function monthShiftStats(month){
  const cfg = profitCfg();
  const list = monthShifts(month);
  let gross = 0, net = 0, km = 0, hrs = 0;
  const rows = list.map(sh => ({ sh, m: shiftMetrics(sh, cfg) }));
  rows.forEach(({ m }) => { gross += m.gross; net += m.net; km += m.km; hrs += m.hrs; });
  return {
    list: rows, count: list.length, gross, net, km, hrs,
    netHr: hrs > 0 ? net / hrs : null,
    grossPerKm: km > 0 ? gross / km : null,
    netPerKm: km > 0 ? net / km : null,
    costPerKm: costRates(cfg).total,
  };
}

/* ---------- shift ops ---------- */
function upsertShift(patch){
  if (!state.data.shifts) state.data.shifts = [];
  const now = new Date().toISOString();
  const clean = {
    date: patch.date,
    start: patch.start || '',
    hours: Math.max(0, Number(patch.hours) || 0),
    odoStart: patch.odoStart === '' || patch.odoStart == null ? null : Number(patch.odoStart),
    odoEnd: patch.odoEnd === '' || patch.odoEnd == null ? null : Number(patch.odoEnd),
    km: Math.max(0, Number(patch.km) || 0),
    gross: Math.round(Number(patch.gross) || 0),
    incentive: Math.max(0, Math.round(Number(patch.incentive) || 0)),
    extra: Math.max(0, Math.round(Number(patch.extra) || 0)),
    kmPerLitre: Number(patch.kmPerLitre) > 0 ? Number(patch.kmPerLitre) : null,
    grabFee: Number.isFinite(Number(patch.grabFee)) ? Math.max(0, Math.round(Number(patch.grabFee))) : null,
    note: String(patch.note || '').slice(0, 120),
    updated: now,
  };
  if (patch.id) {
    const i = state.data.shifts.findIndex(s => s.id === patch.id);
    if (i >= 0) state.data.shifts[i] = { ...state.data.shifts[i], ...clean };
  } else {
    clean.id = uid();
    state.data.shifts.push(clean);
  }
  state.data.updatedAt = now;
  syncShiftFee(clean.id || patch.id);
  queueSave();
}
/**
 * The cover is cash leaving your account, so it has to exist twice: on the shift
 * (drives net and RM/hr) and as an entry (drives cash kept). This keeps exactly
 * one linked entry per shift, and removes it when the cover is zero.
 */
function syncShiftFee(shiftId){
  const sh = (state.data.shifts || []).find(x => x.id === shiftId);
  if (!sh) return null;
  const id = 'fee-' + sh.id;
  const existing = state.data.entries.find(e => e.id === id);
  const fee = Number(sh.grabFee) || 0;
  if (!fee) {
    if (existing) {
      state.data.entries = state.data.entries.filter(e => e.id !== id);
      queueDelete(id);
    }
    return null;
  }
  const row = {
    id, date: sh.date, type: 'expense', cat: 'grabfee',
    amount: Math.round(fee), note: 'Grab insurance',
    updated: new Date().toISOString(),
  };
  if (existing) Object.assign(existing, row);
  else { state.data.entries.push(row); queueUndelete(id); }
  return id;
}
/** Make sure every shift with a cover has its category and exactly one linked entry. */
function backfillShiftFees(){
  const withFee = (state.data.shifts || []).filter(s => (Number(s.grabFee) || 0) > 0);
  if (!withFee.length) return false;
  const cats = state.data.settings.cats.out;
  let changed = false;
  if (!cats.some(c => c.id === 'grabfee')) {
    cats.push({ id: 'grabfee', name: 'Grab insurance', icon: '🛡️' });
    changed = true;
  }
  withFee.forEach(sh => {
    const id = 'fee-' + sh.id;
    if (!state.data.entries.some(e => e.id === id)) { syncShiftFee(sh.id); changed = true; }
  });
  return changed;
}
function deleteShift(id){
  const i = (state.data.shifts || []).findIndex(s => s.id === id);
  if (i < 0) return null;
  const [removed] = state.data.shifts.splice(i, 1);
  const feeId = 'fee-' + id;
  const hadFee = state.data.entries.some(e => e.id === feeId);
  if (hadFee) state.data.entries = state.data.entries.filter(e => e.id !== feeId);
  state.data.updatedAt = new Date().toISOString();
  saveNow({ deletedIds: hadFee ? [id, feeId] : [id] });
  return removed;
}
function lastOdoReading(){
  const list = [...(state.data.shifts || [])].sort((a, b) => a.date.localeCompare(b.date));
  const last = [...list].reverse().find(s => s.odoEnd != null);
  return last ? last.odoEnd : null;
}

function historyResults(){
  const f = state.filters, month = f.month;
  let list = state.data.entries.filter(e => e.date.startsWith(month));
  if (f.type !== 'all') list = list.filter(e => e.type === f.type);
  if (f.cat !== 'all') list = list.filter(e => e.cat === f.cat);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(e => (catName(e.type, e.cat) + ' ' + e.note + ' ' + (e.amount / 100)).toLowerCase().includes(q)); }
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.updated || '').localeCompare(a.updated || ''));
  return histResultsHtml(list, f, month);
}
function histResultsHtml(list, f, month){
  const groups = new Map();
  list.forEach(e => { if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); });
  return groups.size ? [...groups.entries()].map(([date, rows]) => {
    const spent = sum(rows, e => e.amount);
    const h = dayHeading(date, true);
    return `<div class="daygroup">
      <div class="dayhead">
        <span class="d1">${esc(h.main)} · ${esc(h.sub)}</span>
        <span class="d2" style="color:var(--out)">−${rm(spent, { bare: true })}</span>
      </div>
      <div class="card">${rows.map(entryRow).join('')}</div>
    </div>`;
  }).join('') : `<div class="card"><div class="empty">
    <b>No spending here.</b><br>${f.q || f.cat !== 'all' ? 'Try clearing the filters above.' : 'Nothing recorded for ' + monthLabel(month, true) + '.'}
  </div></div>`;
}

/* ----- trend chart ----- */
function monthlyNetSeries(month, n = 12){
  const [y, m] = month.split('-').map(Number);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    const key = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const t = monthTotals(key);
    out.push({ key, net: t.net / 100, income: t.income / 100, expense: t.expense / 100 });
  }
  return out;
}
function cssVar(name, fallback){
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  } catch (e) { return fallback; }
}
function trendChart(month){
  const C_ACCENT = cssVar('--accent', '#c4f042');
  const C_NEG = cssVar('--neg', '#ff8b74');
  const C_DIM = cssVar('--dim', '#66736c');
  const C_MUTED = cssVar('--muted', '#93a09a');
  const C_LINE = cssVar('--line', '#28312c');
  const C_BG = cssVar('--bg', '#0b0f0d');
  const data = monthlyNetSeries(month, 12);
  const W = 660, H = 190, padL = 38, padR = 38, padT = 26, padB = 30;
  const keep = data.map(d => d.net);
  const spent = data.map(d => d.expense);
  let maxV = Math.max(0, ...keep, ...spent), minV = Math.min(0, ...keep);
  if (maxV === minV) { maxV = 100; minV = 0; }
  const span = maxV - minV;
  const X = i => padL + (i * (W - padL - padR)) / Math.max(1, data.length - 1);
  const Y = v => padT + (1 - (v - minV) / span) * (H - padT - padB);
  const zero = Y(0);
  const path = vals => vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
  const keepLine = path(keep);
  const spentLine = path(spent);
  const area = keepLine + ` L${X(data.length-1).toFixed(1)},${zero.toFixed(1)} L${X(0).toFixed(1)},${zero.toFixed(1)} Z`;
  const last = data[data.length - 1];
  const best = data.reduce((a, b) => (b.net > a.net ? b : a), data[0]);
  const labels = data.map((d, i) => {
    if (!(i === data.length - 1 || (i % 2 === 0 && i <= data.length - 3))) return '';
    const anchor = i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
    return `<text x="${X(i).toFixed(1)}" y="${H - 9}" text-anchor="${anchor}" font-size="9.5" fill="${C_DIM}" font-family="var(--num)">${esc(monthLabel(d.key))}</text>`;
  }).join('');
  const ticks = data.map((d, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.net).toFixed(1)}" r="2.6" fill="${C_ACCENT}"/>`).join('');
  const spentTicks = data.map((d, i) => d.expense > 0 ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.expense).toFixed(1)}" r="2.1" fill="${C_NEG}"/>` : '').join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Money kept and spent per month, last 12 months" style="display:block;width:100%;height:auto">
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${C_ACCENT}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${C_ACCENT}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g font-size="9.5" font-family="ui-monospace,monospace">
      <circle cx="${padL}" cy="8" r="3" fill="${C_ACCENT}"/><text x="${padL + 8}" y="11.5" fill="${C_MUTED}">kept</text>
      <circle cx="${padL + 46}" cy="8" r="3" fill="${C_NEG}"/><text x="${padL + 54}" y="11.5" fill="${C_MUTED}">spent</text>
    </g>
    <line x1="${padL}" x2="${W - padR}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" stroke="${C_LINE}" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${area}" fill="url(#tg)"/>
    <path d="${spentLine}" fill="none" stroke="${C_NEG}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    <path d="${keepLine}" fill="none" stroke="${C_ACCENT}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${spentTicks}
    ${ticks}
    <circle cx="${X(data.length-1).toFixed(1)}" cy="${Y(last.net).toFixed(1)}" r="4.4" fill="${C_ACCENT}" stroke="${C_BG}" stroke-width="2"/>
    ${labels}
  </svg>
  <div class="trend-foot">
    <span>Kept <b class="mono" style="color:var(--in)">${rmR(last.net)}</b> <span style="color:var(--dim)">·</span> spent <b class="mono" style="color:var(--out)">${rmR(last.expense)}</b></span>
    <span>Best <b class="mono">${esc(monthLabel(best.key))}</b> ${rmR(best.net)}</span>
  </div>`;
}

  const avgNet = t.net / Math.max(1, daysWith);
  const bestDay = [...new Set(entries.map(e => e.date))].map(d => ({ d, ...dayTotals(d) })).sort((a, b) => b.net - a.net)[0];
  const worstDay = [...new Set(entries.map(e => e.date))].map(d => ({ d, ...dayTotals(d) })).sort((a, b) => a.net - b.net)[0];

  ${(() => {

function openShiftSheet(opts = {}){
  state.calc = null;
  const cfg = profitCfg();
  let base = {
    id: null, date: state.dayDate || todayISO(), start: '', hours: '',
    odoStart: lastOdoReading(), odoEnd: '', km: '',
    gross: '', incentive: '', extra: '', note: '', err: '', kmPerLitre: null,
    grabFee: (profitCfg().grabInsurance || 0).toFixed(2), showMore: false,
  };
  if (opts.id) {
    const sh = (state.data.shifts || []).find(x => x.id === opts.id);
    if (sh) base = {
      ...sh,
      hours: sh.hours ? String(sh.hours) : '',
      odoStart: sh.odoStart == null ? '' : String(sh.odoStart),
      odoEnd: sh.odoEnd == null ? '' : String(sh.odoEnd),
      km: sh.km ? String(sh.km) : '',
      gross: (sh.gross / 100).toFixed(2),
      incentive: sh.incentive ? (sh.incentive / 100).toFixed(2) : '',
      extra: sh.extra ? (sh.extra / 100).toFixed(2) : '',
      grabFee: sh.grabFee != null ? (sh.grabFee / 100).toFixed(2) : (profitCfg().grabInsurance || 0).toFixed(2),
      showMore: true,
      err: '',
    };
  } else {
  }
  state.shiftSheet = base;
  $('#sheetTitle').textContent = opts.id ? 'Edit shift' : 'Log shift';
  $('#sheetWrap').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderShiftSheet();
  setTimeout(() => { const el = $('#sHours'); if (el) el.focus(); }, 60);
}
function closeShiftSheet(){
  state.shiftSheet = null;
  closeSheet();
}
function setShiftField(k, v){ if (state.shiftSheet) state.shiftSheet[k] = v; updateShiftPreview(); }
function shiftPreviewModel(){
  const st = state.shiftSheet; if (!st) return null;
  const cfg = profitCfg();
  const n = x => Number(String(x).replace(/[^0-9.]/g, '')) || 0;
  const hrs = n(st.hours);
  const odoA = n(st.odoStart), odoB = n(st.odoEnd);
  let km = 0, kmSource = '';
  if (odoA > 0 && odoB > odoA) { km = odoB - odoA; kmSource = 'odometer'; }
  else if (n(st.km) > 0) { km = n(st.km); kmSource = 'manual'; }
  else if (hrs > 0) { km = hrs * (cfg.avgSpeed || 30); kmSource = 'estimated'; }
  const c = costRates(cfg, st.kmPerLitre);
  const fuel = km * c.fuel, wear = km * c.wear;
  const gross = n(st.gross) + n(st.incentive);
  const grabFee = n(st.grabFee);
  const net = gross - fuel - wear - n(st.extra) - grabFee;
  return {
    km, kmSource, fuel, wear, running: fuel + wear, gross, net,
    kmPerLitre: c.kmPerLitre, fuelPerKm: c.fuel, extra: n(st.extra), grabFee, hrs,
    netHr: hrs > 0 ? net / hrs : null,
    grossPerKm: km > 0 ? gross / km : null,
    rate: hrs > 0 ? net / hrs : null,
    cfg,
  };
}
function updateShiftPreview(){
  const el = $('#shiftPreview'); if (!el) return;
  const v = shiftPreviewModel(); if (!v) return;
  // nothing entered yet: show a prompt instead of a negative number
  if (!(Number(v.gross) > 0)) {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:4px 2px">
      <div style="font-size:20px">🧾</div>
      <div>
        <div style="font-size:12.5px;font-weight:650">Enter your payout to see the split</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">Hours and distance decide RM/hr; the payout decides everything else.</div>
      </div>
    </div>`;
    return;
  }
  const b = v.netHr == null ? BANDS.none : BANDS[bandFor(v.netHr, v.cfg)];
  const src = v.kmSource === 'odometer' ? 'odometer' : v.kmSource === 'manual' ? 'entered km' : 'est. ' + (v.cfg.avgSpeed || 30) + ' km/h';
  el.innerHTML = `

function openCalc(){
